# Producir videos de punta a punta en GitHub, sin la PC:
# Claude (API) elige e investiga el tema → escribe guion y escenas → revisión automática → voz (ElevenLabs) → render.
# Uso: Actions → "Producir videos" → Run workflow → marca y cantidad.
# También arranca solo cuando se sube un cambio a pedido.json ({"marca": "...", "cantidad": N}).
# Y solo, cada 2 horas: toma un lote de ideas pendientes de la hoja privada "Ideas de videos" (automatico.json
# dice la marca, el tamaño del lote y si está activo). Sin ideas pendientes no hace nada ni gasta nada.
# Necesita los Secrets ANTHROPIC_API_KEY y ELEVENLABS_API_KEY.
name: Producir videos

on:
  workflow_dispatch:
    inputs:
      marca:
        description: "Marca (nombre del archivo en marcas/, sin .json)"
        required: true
        default: "finanzas-familiares"
      cantidad:
        description: "Cuántos videos nuevos"
        required: true
        default: "1"
  push:
    branches: [main]
    paths: ["pedido.json"]
  schedule:
    - cron: "17 */2 * * *"

# Un lote a la vez: si uno sigue corriendo, el siguiente espera (así dos lotes no usan el mismo código de video).
concurrency:
  group: producir-videos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guionista:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      lista: ${{ steps.escribir.outputs.lista }}
      videos: ${{ steps.escribir.outputs.videos }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar el SDK de Claude
        run: python -m pip install -q anthropic

      - name: Tema, guion y escenas con Claude
        id: escribir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          MARCA: ${{ github.event.inputs.marca }}
          CANTIDAD: ${{ github.event.inputs.cantidad }}
        run: |
          MODO=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(jq -r '.activo' automatico.json)" != "true" ]; then echo "::notice::El modo automático está apagado (automatico.json)"; echo "videos=" >> "$GITHUB_OUTPUT"; exit 0; fi
            MARCA=$(jq -r '.marca' automatico.json); CANTIDAD=$(jq -r '.lote' automatico.json); MODO="--solo-hoja --hasta=$(jq -r '.hasta // ""' automatico.json)"
          elif [ -z "$MARCA" ]; then MARCA=$(jq -r '.marca' pedido.json); CANTIDAD=$(jq -r '.cantidad' pedido.json); fi
          echo "marca=$MARCA" >> "$GITHUB_OUTPUT"
          echo "Pedido: $CANTIDAD videos de $MARCA"
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::Falta el Secret ANTHROPIC_API_KEY"; exit 1; fi
          if ! [ -f "marcas/$MARCA.json" ]; then echo "::error::No existe marcas/$MARCA.json"; exit 1; fi
          python -X utf8 tools/producir.py --marca "$MARCA" --cantidad "$CANTIDAD" $MODO
          LISTA=$(grep '^lista=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          echo "videos=$(echo "$LISTA" | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"

      - name: Guardar los guiones en el repo
        if: always()
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add -A videos
          if [ -d rechazados ]; then git add -A rechazados; fi
          git status --short
          if git diff --cached --quiet; then echo "nada nuevo"; exit 0; fi
          git commit -m "Guiones nuevos de ${{ steps.escribir.outputs.marca }}: ${{ steps.escribir.outputs.videos }}"
          git push

      - name: Guiones para revisar (tema, guion, escenas)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: guiones
          path: |
            videos/*/tema.json
            videos/*/guion.txt
            videos/*/escenas.json
            rechazados/
          if-no-files-found: ignore
          retention-days: 7

  render:
    needs: guionista
    if: needs.guionista.outputs.videos != ''
    permissions:
      contents: read
    uses: ./.github/workflows/render.yml
    with:
      videos: ${{ needs.guionista.outputs.videos }}
    secrets: inherit
