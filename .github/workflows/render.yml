# Fábrica de videos en GitHub: voz (ElevenLabs por API) + render (Remotion). Nada corre en la PC.
# - Solo: cada vez que se sube un cambio dentro de videos/<código>/, se hace ese video.
# - A mano: pestaña Actions → "Render de videos" → Run workflow → códigos (ej. FF-001,FF-002).
# Cada video necesita en el repo: videos/<código>/guion.txt y videos/<código>/escenas.json.
# La voz se guarda en caché según el guion: si el guion no cambia, no se vuelve a pagar a ElevenLabs.
# El MP4 se sube solo a Google Drive (Fábrica de Videos / marca / mes) y además queda en "Artifacts" del run por 1 día.
name: Render de videos

on:
  workflow_dispatch:
    inputs:
      videos:
        description: "Códigos de video separados por coma (ej. FF-001,FF-002)"
        required: true
        default: "FF-001"
  workflow_call:
    inputs:
      videos:
        description: "Códigos de video separados por coma"
        required: true
        type: string
  push:
    branches: [main]
    paths: ["videos/**"]

permissions:
  contents: read

concurrency:
  group: render-${{ inputs.videos || github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2
      - id: lista
        name: Qué videos hacer
        env:
          ENTRADA: ${{ inputs.videos }}
          ANTES: ${{ github.event.before }}
        run: |
          if [ -n "$ENTRADA" ]; then
            CODIGOS=$(echo "$ENTRADA" | tr ',' '\n' | sed 's/ //g' | grep -v '^$')
          else
            BASE="${ANTES:-HEAD~1}"
            git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="HEAD~1"
            if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              CODIGOS=$(git diff --name-only "$BASE" HEAD -- videos | cut -d/ -f2 | sort -u)
            else
              # primera subida del repo: hace todos los videos que vengan en ese commit
              CODIGOS=$(git ls-tree -r --name-only HEAD -- videos | cut -d/ -f2 | sort -u)
            fi
          fi
          VALIDOS=""
          for c in $CODIGOS; do
            if [ -f "videos/$c/escenas.json" ] && [ -f "videos/$c/guion.txt" ]; then VALIDOS="$VALIDOS $c"; else echo "::warning::$c no está completo (falta guion.txt o escenas.json)"; fi
          done
          echo "lista=$(printf '%s\n' $VALIDOS | jq -R . | jq -cs 'map(select(length>0))')" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: needs.plan.outputs.lista != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        video: ${{ fromJson(needs.plan.outputs.lista) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Caché de dependencias (Remotion y su navegador)
        id: cache
        uses: actions/cache@v5
        with:
          path: engine/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('engine/package-lock.json') }}

      - name: Instalar dependencias
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: engine
        run: npm ci --no-audit --no-fund

      - name: Instalar ffmpeg y numpy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q numpy

      - name: Caché de la voz (mismo guion y misma voz = no se paga otra vez)
        id: voz
        uses: actions/cache@v5
        with:
          path: |
            videos/${{ matrix.video }}/vo.wav
            videos/${{ matrix.video }}/vo.json
            videos/${{ matrix.video }}/voz
          key: voz-${{ matrix.video }}-${{ hashFiles(format('videos/{0}/guion.txt', matrix.video), 'config.json') }}

      - name: Voz con ElevenLabs
        if: steps.voz.outputs.cache-hit != 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "::error::Falta el Secret ELEVENLABS_API_KEY"; exit 1; fi
          python -X utf8 tools/voz.py "${{ matrix.video }}"

      - name: Render ${{ matrix.video }}
        working-directory: engine
        env:
          PYTHON: python
        run: node render.mjs "${{ matrix.video }}"

      - name: Revisar y normalizar audio
        env:
          SALIDA: ${{ github.workspace }}/salida
        run: |
          python -X utf8 tools/finalizar.py "${{ matrix.video }}" "${{ matrix.video }}"
          cp "videos/${{ matrix.video }}/voz/qa.txt" "salida/${{ matrix.video }}_revision_voz.txt" 2>/dev/null || true
          ls -la salida

      - name: Guardar MP4 (se borra en 1 día)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.video }}
          path: salida/
          retention-days: 1
          compression-level: 0

  drive:
    name: Subir a Google Drive
    needs: render
    if: ${{ !cancelled() && needs.render.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Traer los MP4 de esta corrida
        uses: actions/download-artifact@v7
        with:
          path: entrega

      - name: Subir a Drive (Fábrica de Videos / marca / mes)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python -X utf8 tools/drive.py entrega
